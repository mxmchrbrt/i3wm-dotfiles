; ~/.config/polybar/config.ini
; Monochrome bar with a single mauve accent, matched to the fastfetch panel.
; Tuned for a ThinkPad T480 (eDP-1, dual battery, intel_backlight).

[colors]
background     = #262626
background-alt = #333333
foreground     = #d4d4d4
muted          = #6a6a6a
accent         = #c9a0dc
alert          = #b56464

[bar/main]
monitor = ${env:MONITOR:eDP-1}
width   = 100%
height  = 26pt
radius  = 0
bottom  = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size   = 2pt
border-size = 0

padding-left  = 1
padding-right = 1
module-margin = 1

separator            = |
separator-foreground = ${colors.muted}

; font-0 is the text font, font-1 supplies the glyphs.
; Both are provided by the JetBrainsMono Nerd Font install.
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=13;3

modules-left   = i3 xwindow
modules-center = date
modules-right  = filesystem memory cpu backlight pulseaudio wlan bat0 bat1 tray

wm-restack   = i3
cursor-click = pointer
enable-ipc   = true

; ---------------------------------------------------------------------------

[module/i3]
type = internal/i3
pin-workspaces   = true
show-urgent      = true
strip-wsnumbers  = true
index-sort       = true
enable-click     = true
enable-scroll    = false
format           = <label-state> <label-mode>

label-mode            = %mode%
label-mode-padding    = 1
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.background}

label-focused            = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.accent}
label-focused-padding    = 1

label-visible            = %name%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-padding    = 1

label-unfocused            = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding    = 1

label-urgent            = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding    = 1

[module/xwindow]
type  = internal/xwindow
label = %title:0:70:…%
label-foreground = ${colors.muted}

[module/date]
type     = internal/date
interval = 1
date     = %d-%m-%Y
time     = %H:%M:%S
label    = %date%  %time%
format-prefix            = "󰃭 "
format-prefix-foreground = ${colors.accent}

[module/filesystem]
type     = internal/fs
interval = 60
mount-0  = /
label-mounted   = %{F#c9a0dc}󰋊%{F-} %free%
label-unmounted =

[module/memory]
type     = internal/memory
interval = 2
format-prefix            = "󰍛 "
format-prefix-foreground = ${colors.accent}
label = %gb_used%

[module/cpu]
type     = internal/cpu
interval = 2
format-prefix            = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/backlight]
type = internal/backlight
; verify with: ls /sys/class/backlight/
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label  = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.accent}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume  = %percentage%%
label-muted   = 󰝟 muted
label-muted-foreground = ${colors.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}
click-right = pavucontrol &

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <ramp-signal> <label-connected>
label-connected  = %essid% %downspeed:8%
format-disconnected      = <label-disconnected>
label-disconnected       = 󰤭 offline
label-disconnected-foreground = ${colors.muted}
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-foreground = ${colors.accent}

; --- ThinkPad Power Bridge: two independent packs ---------------------------
; polybar's battery module handles exactly one battery, so the T480 needs two
; module instances. bat1 inherits everything from bat0 and overrides the name.

[module/bat0]
type    = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at  = 15
poll-interval = 5

format-charging    = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = <ramp-capacity> <label-full>
format-low         = <ramp-capacity> <label-low>

label-charging    = 0:%percentage%%
label-discharging = 0:%percentage%% %time%
label-full        = 0:%percentage%%
label-low         = 0:%percentage%% !
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰁿
ramp-capacity-4 = 󰂁
ramp-capacity-foreground = ${colors.accent}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂅
animation-charging-foreground = ${colors.accent}
animation-charging-framerate  = 750

[module/bat1]
inherit = module/bat0
battery = BAT1
label-charging    = 1:%percentage%%
label-discharging = 1:%percentage%% %time%
label-full        = 1:%percentage%%
label-low         = 1:%percentage%% !

[module/tray]
type = internal/tray
format-margin   = 6pt
tray-spacing    = 8pt
tray-background = ${colors.background}

[settings]
screenchange-reload  = true
pseudo-transparency  = false
